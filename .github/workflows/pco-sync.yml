name: Sincronización Planning Center a Firestore

on:
  schedule:
    # Corre automáticamente de martes a sábado
    - cron: '0 21 * * 2-6'
  workflow_dispatch:
    inputs:
      pco_app_id:
        description: 'Application ID de Planning Center (opcional si usas GitHub Secrets)'
        required: false
        default: ''
      pco_secret:
        description: 'Secret de Planning Center (opcional si usas GitHub Secrets)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Sincronizador de Planning Center
        env:
          PCO_APP_ID: ${{ inputs.pco_app_id != '' && inputs.pco_app_id || secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ inputs.pco_secret != '' && inputs.pco_secret || secrets.PCO_SECRET }}
          FIREBASE_PROJECT_ID: 'gestion-decamaras'
        run: |
          python3 scripts/sync_pco.py
